name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 组装站点文件（排除 node_modules / .github / 源码工具）
        run: |
          mkdir -p _site
          cp -r css js img icons _site/
          cp index.html sw.js manifest.webmanifest _site/
          ls -la _site
      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
